<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Areas of Work — Layout Directions</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f2f0eb;font-family:Arial,sans-serif}a{color:inherit}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;padding:18px 24px;background:#ff4b24;color:#000}.intro{padding:8vw 3vw 5vw}.intro h1{max-width:1100px;margin:0;font-size:clamp(54px,10vw,150px);line-height:.8;letter-spacing:-.07em}.option{padding:28px 3vw 7vw;border-top:1px solid #333}.label{font-size:11px;letter-spacing:.1em;color:#ff4b24}.items{margin-top:35px}.items article{padding:18px 0;border-top:1px solid #444}.items h2{margin:0;font-size:clamp(25px,4vw,64px)}.items p{max-width:520px;color:#aaa;line-height:1.45}.o1 .items{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.o1 article{min-height:230px}.o2 .items article{display:grid;grid-template-columns:60px 1fr 1fr;align-items:start}.o3 .items{display:grid;grid-template-columns:repeat(6,1fr)}.o3 article{grid-column:span 2;padding:25px}.o3 article:nth-child(4),.o3 article:nth-child(5){grid-column:span 3}.o4 .items{display:flex;gap:10px;overflow:auto}.o4 article{min-width:38vw;height:45vh;padding:25px;background:#111}.o5 .items{display:grid;grid-template-columns:1fr 1fr;gap:0 5vw}.o5 article:nth-child(1){grid-row:span 2}.o5 article:nth-child(odd){margin-top:8vw}@media(max-width:700px){.o1 .items,.o3 .items,.o5 .items{grid-template-columns:1fr}.o1 article,.o3 article,.o5 article{grid-column:auto!important;margin:0!important}.o2 .items article{grid-template-columns:35px 1fr}.o2 p{grid-column:2}.o4 article{min-width:82vw}}
</style></head><body><header class="top"><b>AREAS OF WORK — FIVE DIRECTIONS</b><a href="index.html#obsessions">BACK TO PORTFOLIO ↗</a></header><section class="intro"><h1>CHOOSE THE RHYTHM, NOT JUST THE GRID.</h1></section><main id="options"></main><script>
const work=[['AI & Creative Workflows','Research, thinking, prototyping and production with new models and tools.'],['Creative Direction','Campaign concepts, visual direction, storytelling and execution oversight.'],['Brand Strategy','Positioning, audience thinking, communication strategy and brand building.'],['Art Direction & Design','Identity systems, campaign worlds, social design and digital experiences.'],['Copy & Concepts','Brand voice, campaign ideas, scripts, films and social communication.']];
const names=['Compact five-column index','Editorial numbered list','Modular studio grid','Horizontal card rail','Staggered field'];document.querySelector('#options').innerHTML=names.map((name,i)=>`<section class="option o${i+1}"><p class="label">0${i+1} / ${name}</p><div class="items">${work.map((x,j)=>`<article><small>0${j+1}</small><h2>${x[0]}</h2><p>${x[1]}</p></article>`).join('')}</div></section>`).join('');
</script></body></html>
